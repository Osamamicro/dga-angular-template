<div class="dga-accordion-item" [class.dga-accordion-item--disabled]="disabled()">
  <button
    class="dga-accordion-item__header"
    [id]="headerId"
    [attr.aria-expanded]="isExpanded()"
    [attr.aria-controls]="panelId"
    [disabled]="disabled()"
    (click)="toggle()"
  >
    <span class="dga-accordion-item__title">{{ title() }}</span>
    <svg
      class="dga-accordion-item__chevron"
      [class.dga-accordion-item__chevron--rotated]="isExpanded()"
      width="20"
      height="20"
      viewBox="0 0 20 20"
      fill="none"
      aria-hidden="true"
    >
      <path
        d="M5 7.5L10 12.5L15 7.5"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
  @if (isExpanded()) {
    <div
      class="dga-accordion-item__panel"
      [id]="panelId"
      role="region"
      [attr.aria-labelledby]="headerId"
    >
      <div class="dga-accordion-item__content">
        <ng-content></ng-content>
      </div>
    </div>
  }
</div>
