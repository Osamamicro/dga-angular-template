<nav [class]="sidebarClasses()" aria-label="Sidebar navigation">
  <ul class="dga-sidebar__list">
    @for (item of items(); track item.label) {
      <li class="dga-sidebar__item">
        @if (item.children && item.children.length > 0) {
          <button
            class="dga-sidebar__link dga-sidebar__link--parent"
            [class.dga-sidebar__link--active]="item.active"
            [attr.aria-expanded]="isGroupExpanded(item.label)"
            (click)="toggleGroup(item.label)"
          >
            <span class="dga-sidebar__label">{{ item.label }}</span>
            <svg class="dga-sidebar__chevron" [class.dga-sidebar__chevron--rotated]="isGroupExpanded(item.label)" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M4 6L8 10L12 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          @if (isGroupExpanded(item.label)) {
            <ul class="dga-sidebar__sublist">
              @for (child of item.children; track child.label) {
                <li>
                  <a class="dga-sidebar__link dga-sidebar__link--child" [class.dga-sidebar__link--active]="child.active" [href]="child.href || '#'" [attr.aria-current]="child.active ? 'page' : null">
                    {{ child.label }}
                  </a>
                </li>
              }
            </ul>
          }
        } @else {
          <a class="dga-sidebar__link" [class.dga-sidebar__link--active]="item.active" [href]="item.href || '#'" [attr.aria-current]="item.active ? 'page' : null">
            <span class="dga-sidebar__label">{{ item.label }}</span>
          </a>
        }
      </li>
    }
  </ul>
</nav>
