@if (open()) {
  <div
    class="dga-modal__backdrop"
    (click)="onBackdropClick($event)"
    [attr.data-open]="true"
  >
    <div
      #dialogContainer
      [class]="modalClasses()"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="titleId"
      [id]="modalId"
      tabindex="-1"
    >
      <div class="dga-modal__header">
        <h2 [id]="titleId" class="dga-modal__title">
          <ng-content select="[modal-title]"></ng-content>
        </h2>
        <button
          class="dga-modal__close"
          type="button"
          aria-label="Close"
          (click)="requestClose()"
        >
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path
              d="M15 5L5 15M5 5L15 15"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
      <div class="dga-modal__body">
        <ng-content></ng-content>
      </div>
      <div class="dga-modal__footer">
        <ng-content select="[modal-footer]"></ng-content>
      </div>
    </div>
  </div>
}
