<button
  [class]="buttonClasses()"
  [type]="type()"
  [disabled]="disabled() || loading()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-disabled]="disabled() || loading()"
  [attr.aria-busy]="loading()"
>
  @if (loading()) {
    <span class="dga-btn__spinner" aria-hidden="true"></span>
  }
  <span class="dga-btn__content" [class.dga-btn__content--hidden]="loading()">
    <ng-content />
  </span>
</button>
