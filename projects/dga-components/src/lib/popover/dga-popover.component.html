<div class="dga-popover">
  <div
    class="dga-popover__trigger"
    (click)="toggle()"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-controls]="popoverId"
  >
    <ng-content select="[popover-trigger]"></ng-content>
  </div>
  @if (isOpen()) {
    <div
      [class]="panelClasses()"
      [id]="popoverId"
      role="dialog"
    >
      <ng-content></ng-content>
    </div>
  }
</div>
