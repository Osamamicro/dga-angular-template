name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npx ng build dga-components --configuration production

      - name: Run tests
        run: npx ng test dga-components --watch=false

      - name: Build demo app
        run: npx ng build demo --configuration production

      - name: Build Storybook
        run: npx ng run dga-components:build-storybook
