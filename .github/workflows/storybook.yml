name: Deploy Demo & Storybook to GitHub Pages

on:
  push:
    branches: [feature/phase-4-nav-feedback, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npx ng build dga-components --configuration production

      - name: Build demo app
        run: npx ng build demo --configuration production --base-href /dga-angular-template/

      - name: Build Storybook
        run: npx ng run dga-components:build-storybook

      - name: Combine outputs
        run: |
          mkdir -p _site
          cp -r dist/demo/browser/* _site/
          cp -r storybook-static _site/storybook

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
